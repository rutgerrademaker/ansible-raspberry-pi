- name: Install Immich
  hosts: pi5
  become: true
  vars:
    app_name: "immich"
    app_dir: "/data/{{ app_name }}"
    app_user: "{{ ansible_user }}"
    app_group: "{{ ansible_group }}"
    docker_port_http: 2283
    subdomain: "immich"

  tasks:
    - name: "Create directories for {{ app_name }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/postgres"
        - "{{ app_dir }}/library"

    - name: Install app files
      ansible.builtin.template:
        src: "templates/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
      loop:
        - src: "compose.yml.j2"
          dest: "{{ app_dir }}/compose.yml"
        - src: ".env.j2"
          dest:  "{{ app_dir }}/.env"

    - name: "Install service for {{ app_name }}"
      ansible.builtin.template:
        src: "../miscelaneous/etc/systemd/system/compose.service.template.j2"
        dest: "/etc/systemd/system/{{ app_name }}.service"
        mode: "0644"
        owner: root
        group: root

    - name: "Enable service {{ app_name }}"
      ansible.builtin.service:
        name: "{{ app_name }}"
        enabled: true

    - name: "Start service {{ app_name }}"
      ansible.builtin.service:
        name: "{{ app_name }}"
        state: restarted