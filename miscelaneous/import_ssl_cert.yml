- name: Trust self-signed wildcard cert
  hosts: all
  vars:
    cert_file: /data/traefik/certs/home.crt
    cert_name: home
  tasks:
    - name: Linux | Copy cert to CA directory
      ansible.builtin.copy:
        src: "{{ cert_file }}"
        dest: "/usr/local/share/ca-certificates/{{ cert_name }}.crt"
        owner: root
        group: root
        mode: "0644"
      when: ansible_facts['os_family'] == "Debian"
      become: true

    - name: Linux | Update CA certificates
      ansible.builtin.command: update-ca-certificates
      when: ansible_facts['os_family'] == "Debian"
      become: true

    - name: macOS | Install cert in system keychain
      community.general.command:
        cmd: sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "{{ cert_file }}"
      when: ansible_facts['os_family'] == "Darwin"
      become: true

    - name: Windows | Install cert in Trusted Root store
      community.windows.win_certificate_store:
        path: "{{ cert_file }}"
        state: present
        store_name: Root
      when: ansible_facts['os_family'] == "Windows"
