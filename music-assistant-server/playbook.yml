- name: Install Music Assistant Server
  hosts: pi5
  become: true
  vars:
    app_name: "music-assistant-server"
    app_dir: "/data/{{ app_name }}"
    app_user: "{{ ansible_user }}"
    app_group: "{{ ansible_group }}"
    docker_port_http: "8095"
    docker_port_tcp: "8097"
    subdomain: "mas"
  tasks:
    - name: Create directories for {{ app_name }}
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/dynamic"

    - name: Install Music Assistant Server compose file
      ansible.builtin.template:
        src: templates/compose.yml.j2
        dest: "{{ app_dir }}/compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0600"

    - name: Install Music Assistant Traefik file
      ansible.builtin.template:
        src: templates/opt/traefik/dynamic/music-assistant-server.yml.j2
        dest: "{{ app_dir }}/dynamic/music-assistant-server.yml"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0600"

    - name: "Install service for {{ app_name }}"
      ansible.builtin.template:
        src: "../miscelaneous/etc/systemd/system/compose.service.template.j2"
        dest: "/etc/systemd/system/{{ app_name }}.service"
        mode: "0644"
        owner: root
        group: root

    - name: "Enable service {{ app_name }}"
      ansible.builtin.service:
        name: "{{ app_name }}"
        enabled: true

    - name: "Start service {{ app_name }}"
      ansible.builtin.service:
        name: "{{ app_name }}"
        state: restarted
