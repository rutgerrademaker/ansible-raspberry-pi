- name: Local CA + wildcard cert
  hosts: pi5
  become: true
  vars_files:
    - vars/ca.yml

  tasks:
    - name: Ensure directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ca_dir }}"
        - "{{ ca_dir }}/newcerts"
        - "{{ cert_dir }}"
        - "{{ crl_dir }}"

    - name: Remove old cert files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ cert_dir }}/{{ cert_domain }}.key"
        - "{{ cert_dir }}/{{ cert_domain }}.csr"
        - "{{ cert_dir }}/{{ cert_domain }}.crt"

    - name: Generate private key
      community.crypto.openssl_privatekey:
        path: "{{ cert_dir }}/{{ cert_domain }}.key"
        size: 4096
        type: RSA
        mode: "0600"

    - name: Generate CSR with SAN and server auth
      community.crypto.openssl_csr:
        path: "{{ cert_dir }}/{{ cert_domain }}.csr"
        privatekey_path: "{{ cert_dir }}/{{ cert_domain }}.key"
        common_name: "*.{{ cert_domain }}"
        country_name: "{{ cert_subject.C }}"
        state_or_province_name: "{{ cert_subject.ST }}"
        locality_name: "{{ cert_subject.L }}"
        organization_name: "{{ cert_subject.O }}"
        organizational_unit_name: "{{ cert_subject.OU }}"
        subject_alt_name:
          - "DNS:*.{{ cert_domain }}"
          - "DNS:{{ cert_domain }}"
        key_usage:
          - digitalSignature
          - keyEncipherment
        extended_key_usage:
          - serverAuth

    - name: Check if CA private key exists
      ansible.builtin.stat:
        path: "{{ ca_dir }}/{{ ca_name }}.key"
      register: ca_privatekey_stat

    - name: Generate CA private key
      community.crypto.openssl_privatekey:
        path: "{{ ca_dir }}/{{ ca_name }}.key"
        size: 4096
        type: RSA
        mode: "0600"
      when: not ca_privatekey_stat.stat.exists

    - name: Check if CA CSR exists
      ansible.builtin.stat:
        path: "{{ ca_dir }}/{{ ca_name }}.csr"
      register: ca_csr_stat

    - name: Generate CA CSR
      community.crypto.openssl_csr:
        path: "{{ ca_dir }}/{{ ca_name }}.csr"
        privatekey_path: "{{ ca_dir }}/{{ ca_name }}.key"
        common_name: "{{ ca_name }}"
        country_name: "{{ subject.C }}"
        state_or_province_name: "{{ subject.ST }}"
        locality_name: "{{ subject.L }}"
        organization_name: "{{ subject.O }}"
        organizational_unit_name: "{{ subject.OU }}"
        basic_constraints:
          - "CA:TRUE"
        key_usage:
          - keyCertSign
          - cRLSign
      when: not ca_csr_stat.stat.exists

    - name: Check if CA cert exists
      ansible.builtin.stat:
        path: "{{ ca_dir }}/{{ ca_name }}.crt"
      register: ca_crt_stat
     
    - name: Ensure CA database files exist
      ansible.builtin.file:
        path: "{{ ca_dir }}/{{ item }}"
        state: touch
        mode: "0644"
      loop:
        - index.txt
        - serial
        - crlnumber
      when: not ca_crt_stat.stat.exists

    - name: Initialize CA serial
      ansible.builtin.copy:
        dest: "{{ ca_dir }}/serial"
        content: "1000\n"
        mode: "0644"
      when: not ca_crt_stat.stat.exists

    - name: Initialize CA crlnumber
      ansible.builtin.copy:
        dest: "{{ ca_dir }}/crlnumber"
        content: "1000\n"
        mode: "0644"
      when: not ca_crt_stat.stat.exists

    - name: Install OpenSSL CA config
      ansible.builtin.template:
        src: openssl-ca.cnf.j2
        dest: "{{ ca_dir }}/openssl-ca.cnf"
        mode: "0644"
      #when: not ca_crt_stat.stat.exists

    - name: Generate CA certificate with v3_ca extensions
      ansible.builtin.command:
        cmd: >
          openssl x509
          -req
          -in {{ ca_dir }}/{{ ca_name }}.csr
          -signkey {{ ca_dir }}/{{ ca_name }}.key
          -days {{ ca_valid_days }}
          -sha256
          -extfile {{ ca_dir }}/openssl-ca.cnf
          -extensions v3_ca
          -out {{ ca_dir }}/{{ ca_name }}.crt
      args:
        creates: "{{ ca_dir }}/{{ ca_name }}.crt"
      when: not ca_crt_stat.stat.exists

    - name: Generate CA CRL
      ansible.builtin.command:
        cmd: >
          openssl ca -gencrl
          -config {{ ca_dir }}/openssl-ca.cnf
          -out {{ crl_dir }}/{{ ca_name }}.crl
      environment:
        OPENSSL_CONF: "{{ ca_dir }}/openssl-ca.cnf"
      changed_when: true
  
    - name: Generate CSR with SAN and server auth
      community.crypto.openssl_csr:
        path: "{{ cert_dir }}/{{ cert_domain }}.csr"
        privatekey_path: "{{ cert_dir }}/{{ cert_domain }}.key"
        common_name: "*.{{ cert_domain }}"
        subject_alt_name:
          - "DNS:*.{{ cert_domain }}"
          - "DNS:{{ cert_domain }}"
        key_usage:
          - digitalSignature
          - keyEncipherment
        extended_key_usage:
          - serverAuth

    # - name: Sign leaf certificate with CRL DP (OpenSSL)
