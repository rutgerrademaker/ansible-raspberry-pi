- name: Local CA + wildcard cert
  hosts: pi5
  become: true
  vars_files:
    - vars/ca.yml

  tasks:
    - name: Ensure directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ca_dir }}"
        - "{{ cert_dir }}"

    - name: Remove old cert files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ cert_dir }}/{{ cert_domain }}.key"
        - "{{ cert_dir }}/{{ cert_domain }}.csr"
        - "{{ cert_dir }}/{{ cert_domain }}.crt"

    - name: Generate private key
      community.crypto.openssl_privatekey:
        path: "{{ cert_dir }}/{{ cert_domain }}.key"
        size: 4096
        type: RSA
        mode: "0600"

    - name: Generate CSR with SAN and server auth
      community.crypto.openssl_csr:
        path: "{{ cert_dir }}/{{ cert_domain }}.csr"
        privatekey_path: "{{ cert_dir }}/{{ cert_domain }}.key"
        common_name: "*.{{ cert_domain }}"
        country_name: "{{ cert_subject.C }}"
        state_or_province_name: "{{ cert_subject.ST }}"
        locality_name: "{{ cert_subject.L }}"
        organization_name: "{{ cert_subject.O }}"
        organizational_unit_name: "{{ cert_subject.OU }}"
        subject_alt_name:
          - "DNS:*.{{ cert_domain }}"
          - "DNS:{{ cert_domain }}"
        key_usage:
          - digitalSignature
          - keyEncipherment
        extended_key_usage:
          - serverAuth

    - name: Check if CA private key exists
      ansible.builtin.stat:
        path: "{{ ca_dir }}/{{ ca_name }}.key"
      register: ca_privatekey_stat

    - name: Generate CA private key
      community.crypto.openssl_privatekey:
        path: "{{ ca_dir }}/{{ ca_name }}.key"
        size: 4096
        type: RSA
        mode: "0600"
      when: not ca_privatekey_stat.stat.exists

    - name: Check if CA CSR exists
      ansible.builtin.stat:
        path: "{{ ca_dir }}/{{ ca_name }}.csr"
      register: ca_csr_stat

    - name: Generate CA CSR
      community.crypto.openssl_csr:
        path: "{{ ca_dir }}/{{ ca_name }}.csr"
        privatekey_path: "{{ ca_dir }}/{{ ca_name }}.key"
        common_name: "{{ ca_name }}"
        country_name: "{{ subject.C }}"
        state_or_province_name: "{{ subject.ST }}"
        locality_name: "{{ subject.L }}"
        organization_name: "{{ subject.O }}"
        organizational_unit_name: "{{ subject.OU }}"
        basic_constraints:
          - "CA:TRUE"
        key_usage:
          - keyCertSign
          - cRLSign
      when: not ca_csr_stat.stat.exists

    - name: Self-sign CA certificate
      community.crypto.x509_certificate:
        path: "{{ ca_dir }}/{{ ca_name }}.crt"
        csr_path: "{{ ca_dir }}/{{ ca_name }}.csr"
        privatekey_path: "{{ ca_dir }}/{{ ca_name }}.key"
        provider: selfsigned
        selfsigned_not_after: "+{{ ca_valid_days }}d"

    - name: Sign leaf cert with local CA
      community.crypto.x509_certificate:
        path: "{{ cert_dir }}/{{ cert_domain }}.crt"
        csr_path: "{{ cert_dir }}/{{ cert_domain }}.csr"
        ownca_path: "{{ ca_dir }}/{{ ca_name }}.crt"
        ownca_privatekey_path: "{{ ca_dir }}/{{ ca_name }}.key"
        provider: ownca

    - name: Sign leaf cert with local CA
      community.crypto.x509_certificate:
        path: "{{ cert_dir }}/{{ cert_domain }}.crt"
        csr_path: "{{ cert_dir }}/{{ cert_domain }}.csr"
        ownca_path: "{{ ca_dir }}/{{ ca_name }}.crt"
        ownca_privatekey_path: "{{ ca_dir }}/{{ ca_name }}.key"
        provider: ownca

    - name: Read leaf certificate from remote
      ansible.builtin.slurp:
        src: "{{ cert_dir }}/{{ cert_domain }}.crt"
      register: leaf_cert

    - name: Read CA certificate from remote
      ansible.builtin.slurp:
        src: "{{ ca_dir }}/{{ ca_name }}.crt"
      register: ca_cert

    - name: Build fullchain certificate
      ansible.builtin.copy:
        dest: "{{ cert_dir }}/{{ cert_domain }}-fullchain.crt"
        owner: root
        group: root
        mode: "0644"
        content: |
          {{ leaf_cert.content | b64decode }}
          {{ ca_cert.content | b64decode }}
     
    - name: Configure Traefik TLS store
      ansible.builtin.template:
        src: traefik-tls.yml.j2
        dest: "{{ traefik_dir }}/dynamic/tls.yml"
        mode: "0644"
      notify: Restart Traefik

  handlers:
    - name: Restart Traefik
      ansible.builtin.service:
        name: traefik
        state: restarted
